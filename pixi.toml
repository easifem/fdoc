[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "fdoc"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64", "win-64"]
version = "0.0.1"

[tasks]
build = { cmd = "fpm build --profile release", description = "Build fdoc" }
test = { cmd = "fpm test", description = "Run the unit tests" }
doc = { cmd = "fpm run fdoc --profile release --", description = "Run fdoc on this project, or give a project file: pixi run doc [ford.md]" }
gen-assets = { cmd = "python tools/gen_assets.py", description = "Generate src/fdoc_assets.f90 from assets/" }
check-links = { cmd = "python tools/check_links.py", description = "Check the links of a generated site: pixi run check-links doc" }
check-docs = { cmd = "python tools/check_docs.py", description = "Check that every routine and argument is documented" }
check-threads = { cmd = "python tools/check_threads.py", depends-on = ["build"], description = "Check that code running in parallel avoids deferred-length function results" }
compare = { cmd = "python tools/compare.py", description = "Compare fdoc with FORD: pixi run compare settings PROJECT_FILE..." }

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
ford = ">=7.0"
graphviz = ">=14.1.2,<15"

