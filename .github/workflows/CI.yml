name: CI
on:
  push:
  pull_request:

jobs:

  # the unit tests, and fdoc on real projects, on every platform it must support, from the
  # same pixi environment (gfortran, fpm) used locally
  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # fdoc does not run on Windows yet (see M9 in plans/fdoc-plan.md), so that job shows how
    # far it gets without failing the workflow. Remove this when it passes.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    # installs pixi and creates the environment from pixi.toml/pixi.lock
    - name: Setup pixi environment
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.80.0
        locked: true   # fail if pixi.lock is out of date with pixi.toml
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/master' }}

    - name: Run tests
      run: pixi run test

    # fdoc on a few real projects, each pinned to a commit, using the build of the tests, with
    # its runtime checks. This takes about a minute, and stdlib takes most of that.
    - name: Run fdoc on real projects
      run: pixi run test-projects

    - name: Check the code
      if: runner.os == 'Linux'
      run: |
        pixi run check-docs
        pixi run check-standard
        pixi run check-threads

  # the API documentation, generated by fdoc, published to GitHub Pages from master
  Documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Setup pixi environment
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.80.0
        locked: true
        cache: true
        cache-write: false   # (the Test jobs write the cache)

    - name: Build documentation
      run: pixi run doc

    - name: Deploy documentation
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        branch: gh-pages   # the branch the action should deploy to
        folder: doc        # output_dir in fpm.toml
        single-commit: true

