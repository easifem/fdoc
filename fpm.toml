name = "fdoc"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "Fortran documenter written in Fortran"
keywords = ["documentation"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[[executable]]
name = "fdoc"
source-dir = "app"
main = "main.f90"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fformat = { git = "https://github.com/jacobwilliams/fformat.git", tag = "1.0.2" }
json-fortran = { git = "https://github.com/jacobwilliams/json-fortran.git", tag = "9.3.1" }
toml-f = { git = "https://github.com/toml-f/toml-f", tag = "v0.5.2" }
openmp = "*"

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.5.0" }
